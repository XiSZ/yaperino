# Publishes the website (site/) to GitHub Pages: https://xisz.github.io/yaperino/
# Runs when the site changes on main and after each release, so the version, the
# download links and the changelog are always current. site/build.py fills them in.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Build the site
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          OUT_DIR: _site
        run: python3 site/build.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
