[package]
name = "yaperino"
version = "0.1.0"
edition = "2021"
description = "Yaperino: a Chatterino-style chat for Twitch, Kick, YouTube and TikTok with a live list of the channels you follow"

# The program file keeps its earlier name: Windows' ransomware protection has an
# exception for it, and a new name would be blocked from saving into Documents.
[[bin]]
name = "live-streams"
path = "src/main.rs"

[dependencies]
# x11 and wayland: the window on Linux (both do nothing on Windows and macOS)
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "clipboard", "links", "x11", "wayland"] }
egui = "0.37"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "jpeg"] }
flate2 = "1"
sha2 = "0.10"
sha1 = "0.10"
# Chatterino-style plugins (Lua 5.4, compiled in)
mlua = { version = "0.12", features = ["lua54", "vendored"] }
# regex highlights, ignores and filters
regex = "1"
# dates for chat log files
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"
egui_extras = { version = "0.37", features = ["all_loaders", "http", "gif", "webp"] }

# Sign-in pages (Kick, YouTube) in a small login window, so no developer app is needed.
# Not on Linux yet: there it would need WebKitGTK on every user's system (see weblogin.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
wry = "0.57"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
# the Windows notification sound (highlights, live notifications)
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
# Windows notifications for live channels (Chatterino's "Show notification")
tauri-winrt-notification = "0.8"

[build-dependencies]
# the program's icon and name in Windows (see build.rs)
winresource = "0.1"

[profile.release]
opt-level = 2
