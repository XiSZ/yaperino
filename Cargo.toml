[package]
name = "yaperino"
version = "0.3.1"
edition = "2021"
description = "Yaperino: a Chatterino-style chat for Twitch, Kick, YouTube and TikTok with a live list of the channels you follow"

# The program file keeps its earlier name: Windows' ransomware protection has an
# exception for it, and a new name would be blocked from saving into Documents.
[[bin]]
name = "live-streams"
path = "src/main.rs"

# Linux only: the Kick / YouTube sign-in window as a separate small program, so only it
# needs WebKitGTK (see src/login_main.rs). Built with --features linux-login.
[[bin]]
name = "yaperino-login"
path = "src/login_main.rs"
required-features = ["linux-login"]

[features]
# The Kick / YouTube sign-in window (wry + winit). On by default; the Linux release builds
# Yaperino itself with --no-default-features, so only the helper needs WebKitGTK.
default = ["webview"]
webview = ["dep:wry", "dep:winit"]
# Linux: the yaperino-login helper (the window plus GTK)
linux-login = ["webview", "dep:gtk"]

[dependencies]
# x11 and wayland: the window on Linux (both do nothing on Windows and macOS)
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "clipboard", "links", "x11", "wayland"] }
egui = "0.37"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "jpeg"] }
flate2 = "1"
sha2 = "0.10"
sha1 = "0.10"
# Chatterino-style plugins (Lua 5.4, compiled in)
mlua = { version = "0.12", features = ["lua54", "vendored"] }
# regex highlights, ignores and filters
regex = "1"
# dates for chat log files
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"
egui_extras = { version = "0.37", features = ["all_loaders", "http", "gif", "webp"] }

# Sign-in pages (Kick, YouTube) in a small login window, so no developer app is needed
# (feature "webview")
wry = { version = "0.57", optional = true }
winit = { version = "0.30", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

# Notifications for live channels on Linux (D-Bus, in pure Rust) and macOS
[target.'cfg(not(windows))'.dependencies]
notify-rust = "4.19"

[target.'cfg(windows)'.dependencies]
# Hide to tray: the icon by the clock, and the main window's handle to show / hide it
tray-icon = { version = "0.26", default-features = false }
raw-window-handle = "0.6"
# the Windows notification sound (highlights, live notifications)
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
# Windows notifications for live channels (Chatterino's "Show notification")
tauri-winrt-notification = "0.8"

[build-dependencies]
# the program's icon and name in Windows (see build.rs)
winresource = "0.1"

[profile.release]
opt-level = 2
